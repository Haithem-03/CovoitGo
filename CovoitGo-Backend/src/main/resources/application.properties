server.port=8081

# MySQL (XAMPP / WAMP : utilisateur root, mot de passe vide par defaut)
spring.datasource.url=jdbc:mysql://localhost:3306/covoitgo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# Les tables sont creees / mises a jour automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
